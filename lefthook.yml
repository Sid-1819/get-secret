# https://lefthook.dev/
min_version: 1.6.0

pre-commit:
  parallel: true
  commands:
    api-eslint:
      root: "apps/api"
      glob: "apps/api/{src,test}/**/*.ts"
      run: pnpm --dir ../.. --filter @getsecret/api exec eslint --fix {staged_files}
      stage_fixed: true

    api-prettier:
      root: "apps/api"
      glob: "apps/api/{src,test}/**/*.ts"
      run: pnpm --dir ../.. --filter @getsecret/api exec prettier --write {staged_files}
      stage_fixed: true

    sdk-typecheck:
      glob: "packages/sdk/**/*.ts"
      run: pnpm --filter @getsecret/sdk run typecheck

    sdk-test:
      glob: "packages/sdk/**/*.ts"
      run: pnpm --filter @getsecret/sdk run test

    cli-typecheck:
      glob: "packages/cli/**/*.ts"
      run: pnpm --filter getsecret run typecheck

    web-eslint:
      root: "apps/web"
      glob: "apps/web/src/**/*.{ts,tsx}"
      run: pnpm --dir ../.. --filter @getsecret/web exec eslint --fix {staged_files}
      stage_fixed: true

    extension-typecheck:
      glob: "apps/extension/src/**/*.{ts,tsx}"
      run: pnpm --filter @getsecret/extension run typecheck

pre-push:
  commands:
    test:
      run: pnpm -r --if-present run test
    build:
      run: pnpm -r --if-present run build
